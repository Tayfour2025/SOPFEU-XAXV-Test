<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent; /* change to black if needed */
      overflow: hidden;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;  /* vertical center */
      align-items: center;      /* horizontal center */
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;             /* change if background is white */
    }

    #time {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.0;
    }

    #date {
      margin-top: 10px;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="time">--:--:--</div>
    <div id="date">----</div>
  </div>

  <script>
    function update() {
      const now = new Date();

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').textContent = `${hh}:${mm}:${ss}`;

      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: '2-digit' };
      document.getElementById('date').textContent = now.toLocaleDateString(undefined, opts);
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
