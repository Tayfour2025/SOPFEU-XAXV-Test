<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>

<body onload="start()" style="margin:0;background:black;">

  <!-- Static text to prove rendering -->
  <div style="color:white;font-family:Arial;font-size:40px;padding:20px;">
    CLOCK TEST
  </div>

  <div id="time" style="color:white;font-family:Arial;font-size:90px;font-weight:bold;padding:20px;">
    --:--:--
  </div>

  <div id="date" style="color:white;font-family:Arial;font-size:40px;padding:0 20px 20px 20px;">
    ----
  </div>

<script type="text/javascript">
  function pad2(n) { return (n < 10) ? ("0" + n) : ("" + n); }

  function tick() {
    var now = new Date();
    var hh = pad2(now.getHours());
    var mm = pad2(now.getMinutes());
    var ss = pad2(now.getSeconds());
    document.getElementById("time").innerHTML = hh + ":" + mm + ":" + ss;

    var dd = pad2(now.getDate());
    var mo = pad2(now.getMonth() + 1);
    var yy = now.getFullYear();
    document.getElementById("date").innerHTML = yy + "-" + mo + "-" + dd;
  }

  function start() {
    tick();
    setInterval(tick, 1000);
  }
</script>

</body>
</html>
