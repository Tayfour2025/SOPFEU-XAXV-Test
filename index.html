<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>

<body onload="start()" style="margin:0; background:black; overflow:hidden;">

  <div id="container" style="
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    text-align:center;
    font-family: Arial, sans-serif;
    color:white;
  ">
    <div id="title" style="font-size:48px; font-weight:bold; margin-bottom:20px;">
      Terrebonne Time
    </div>

    <div id="time" style="font-size:110px; font-weight:bold; line-height:1;">
      --:--:--
    </div>

    <div id="date" style="font-size:44px; margin-top:15px;">
      ----
    </div>
  </div>

<script type="text/javascript">
  function pad2(n) { return (n < 10) ? ("0" + n) : ("" + n); }

  function tick() {
    var now = new Date();

    var hh = pad2(now.getHours());
    var mm = pad2(now.getMinutes());
    var ss = pad2(now.getSeconds());
    document.getElementById("time").innerHTML = hh + ":" + mm + ":" + ss;

    var dd = pad2(now.getDate());
    var mo = pad2(now.getMonth() + 1);
    var yy = now.getFullYear();
    document.getElementById("date").innerHTML = yy + "-" + mo + "-" + dd;
  }

  function start() {
    tick();
    setInterval(tick, 1000);
  }
</script>

</body>
</html>
